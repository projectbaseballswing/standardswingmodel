name: Swing service regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: swing-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-api.txt
      - name: Install API and synthetic pose test dependencies
        run: python -m pip install -r requirements-api.txt pandas scipy 'mediapipe<1'
      - name: API, authorization, migration and synthetic geometry tests
        run: python -m pytest -q tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          RUN_SUPABASE_INTEGRATION_TESTS: '0'
      # No remote credentials, model inference, migration or private datasets in CI.

  flutter-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Browser-only Blob lifecycle regressions
        run: flutter test --no-pub --platform chrome test/swing_upload_test.dart
        env:
          CHROME_EXECUTABLE: /usr/bin/google-chrome
      - run: flutter build web --no-pub --no-web-resources-cdn
